<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../dist/main.js" defer></script>
    <link rel="stylesheet" type="text/css" href="../css/layout.css?rnd=12345"/>
    <link rel="stylesheet" type="text/css" href="../css/style.css?rnd=12345"/>
    <title>Kessoku Hero</title>
</head>
<body>
    <div id="left">
        <div id="control" class="board">
            <h2>Control panel</h2>
            <button id="start">Start</button>
            <button id="reset">Reset</button>
        </div>
        <div id="keybind" class="board">
            <h2>Keybinds:</h2>
            <kbd>A</kbd>
            <kbd>S</kbd>
            <kbd>D</kbd>
            <kbd>←</kbd>
            <kbd>↓</kbd>
        </div>
    </div>
    <div id="game">
        <canvas id="canvas"></canvas>
    </div>
    <div id="score" class="board">
        <div>
            <h2>Score:</h2>
            <div id="points" class="points">0</div>
        </div>
        <div>
            <h2>Stats:</h2>
            <ul>
                <li>
                    <label for="perfect">Perfect hits:</label>
                    <div id="perfect" class="stat">0 (0%)</div>
                </li>
                <li>
                    <label for="good">Good hits:</label>
                    <div id="good" class="stat">0 (0%)</div>
                </li>
                <li>
                    <label for="ok">OK hits:</label>
                    <div id="ok" class="stat">0 (0%)</div>
                </li>
                <li>
                    <label for="miss">Misses:</label>
                    <div id="miss" class="stat">0 (0%)</div>
                </li>
            </ul>
        </div>
        <div>
            <h2>High Score:</h2>
            <div id="high-score" class="points">0</div>
        </div>
    </div>
</body>
</html>
