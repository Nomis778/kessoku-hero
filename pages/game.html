<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../dist/main.js" defer></script>
    <link rel="stylesheet" type="text/css" href="../css/game.css?rnd=12345"/>
    <title>Kessoku Hero</title>
</head>
<body>
    <div id="control" class="board">
        <h2>Control panel</h2>
        <button id="start">Start</button>
        <button id="reset">Reset</button>
    </div>
    <div id="info" class="board">
        <h2>Keybinds:</h2>
        <kbd>W</kbd>
        <kbd>S</kbd>
        <kbd>D</kbd>
        <kbd>←</kbd>
        <kbd>↓</kbd>
    </div>
    <div id="score" class="board">
        <div>

            <h2>Score:</h2>
            <ul>
                <li>
                    <label for="points">Points:</label>
                    <div id="points">0</div>
                </li>
                <li>
                    <label for="perfect">Perfect hits:</label>
                    <div id="perfect">0 (0%)</div>
                </li>
                <li>
                    <label for="good">Good hits:</label>
                    <div id="good">0 (0%)</div>
                </li>
                <li>
                    <label for="mediocre">Mediocre hits:</label>
                    <div id="mediocre">0 (0%)</div>
                </li>
                <li>
                    <label for="miss">Misses:</label>
                    <div id="miss">0 (0%)</div>
                </li>
            </ul>
        </div>
        <div>
            <h2>High Score:</h2>
            <div id="high-score">0</div>
        </div>
    </div>
    <canvas id="canvas"></canvas>
</body>
</html>
